<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mik Portfolio icon. The colors follow the device's light/dark setting. -->
  <style>
    .tile { fill: url(#light-tile); }
    .mark { stroke: #ffffff; }
    .spark { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: url(#dark-tile); }
      .mark { stroke: #1d1528; }
      .spark { fill: #1d1528; }
    }
  </style>
  <defs>
    <linearGradient id="light-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f5fd6"/>
      <stop offset="1" stop-color="#5f349c"/>
    </linearGradient>
    <linearGradient id="dark-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcc6fa"/>
      <stop offset="1" stop-color="#b48ae8"/>
    </linearGradient>
  </defs>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="15"/>
  <!-- "M" monogram -->
  <path class="mark" d="M17 46V19l15 17 15-17v27" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ✦ sparkle -->
  <path class="spark" d="M52 7.5c.6 3.2 1.3 3.9 4.5 4.5-3.2.6-3.9 1.3-4.5 4.5-.6-3.2-1.3-3.9-4.5-4.5 3.2-.6 3.9-1.3 4.5-4.5z"/>
</svg>
