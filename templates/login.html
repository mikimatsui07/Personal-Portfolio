<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mik Portfolio</title>

    {% include "_favicon.html" %}

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- No theme buttons here: theme.js applies the theme chosen on the
         portfolio or dashboard (System, Light or Dark). -->
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='loading.js') }}"></script>
</head>

<body>

    {% with skeleton="login" %}{% include "_page_skeleton.html" %}{% endwith %}

    <div class="login-container">

        <div class="login-box">

            <h1>MIK | PORTFOLIO</h1>
            <h2>Admin Login</h2>

            {% if error %}
                <p class="login-error">{{ error }}</p>
            {% endif %}

            <form method="POST">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">LOG IN</button>

            </form>

            <a href="/">← Back to Portfolio</a>

        </div>

    </div>

</body>
</html>
